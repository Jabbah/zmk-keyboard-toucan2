CONFIG_ZMK_POINTING=y
CONFIG_ZMK_MOUSE=y

CONFIG_ZMK_BATTERY_REPORTING=y
# Battery level fetching/proxy are enabled by Kconfig.defconfig when the left half is central

# Enter deep sleep https://zmk.dev/docs/features/low-power-states
CONFIG_ZMK_SLEEP=y

# Defaults to 15 minutes but 60 minutes is only very slightly more power draw and user experience is much better to not
# have keyboard go to deep sleep (i.e. having to reconenect to bluetooth)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# This is for 'regular' ZMK idle behavior.  Default is 30000 (30 seconds)
# This helps A LOT with touchpad power consumption (only 1.7mA idle vs 2.9mA active).  The only user visible aspect is
# that the touchpad needs 300ms to start seeing touches when next pressed - but this behavior is suppressed if we
# have pressed a keyboard key within the last 30 seconds (highly likely).
# Raised from 30000 to 60000: keeps the BLE link in fast/active mode longer so the top-row mouse-click combos
# don't miss their timeout window when waking from idle (cost: slightly more touchpad idle power).
CONFIG_ZMK_IDLE_TIMEOUT=60000

# Slave latency 0: peripheral listens on every connection event instead of skipping them while idle. This shrinks
# the wake-up delay on the first keypress after idle, which is what stretches combo key gaps past their timeout.
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0

# Change the style of the status screen. Available options: 0, 1, 2
CONFIG_TOUCAN_STATUS_SCREEN=2

CONFIG_INPUT_THREAD_STACK_SIZE=2048
